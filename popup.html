<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>match13</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <div class="cloud-field" aria-hidden="true">
      <span class="cloud cloud--one"></span>
      <span class="cloud cloud--two"></span>
      <span class="cloud cloud--three"></span>
      <span class="cloud cloud--four"></span>
    </div>
    <main class="app-shell">
      <header class="brand-header">
        <a class="brand-link" href="https://www.match13.com/" target="_blank" rel="noreferrer" aria-label="Open Match 13 website">
          <img class="brand-wordmark-image" src="match13-wordmark.png" alt="Match 13">
        </a>
      </header>

      <section id="setup-view" class="setup-card" aria-labelledby="setup-title">
        <div id="key-setup">
          <div class="eyebrow">FIRST START</div>
          <h1 id="setup-title">Connect Match 13</h1>
          <p class="muted">Create an API key on your <a href="https://www.match13.com/account" target="_blank" rel="noreferrer">Match 13 account page</a>. Paste it below to connect this extension.</p>
          <form id="key-form" class="stack-form">
            <label for="api-key-input">API key</label>
            <div class="input-action-row">
              <input id="api-key-input" type="password" autocomplete="off" spellcheck="false" placeholder="m13_live_…" required>
              <button class="primary-button" type="submit">Save key</button>
            </div>
          </form>
        </div>
        <div id="team-setup" hidden>
          <div class="eyebrow">GET STARTED</div>
          <h1>Pick a team to begin</h1>
          <form id="setup-form" class="stack-form">
            <label for="setup-team">Team number</label>
            <div class="input-action-row">
              <input id="setup-team" inputmode="numeric" autocomplete="off" placeholder="e.g. 581" required>
              <button class="primary-button" type="submit">Load team</button>
            </div>
          </form>
        </div>
        <p id="setup-status" class="status" role="status"></p>
      </section>

      <section id="dashboard-view" class="dashboard" hidden>
        <div class="toolbar dashboard-toolbar">
          <form id="team-form" class="team-search" role="search">
            <label class="sr-only" for="team-input">Search</label>
            <span class="search-icon" aria-hidden="true">⌕</span>
            <input id="team-input" type="search" inputmode="numeric" autocomplete="on" list="team-suggestions" aria-label="Search" placeholder="Search">
            <datalist id="team-suggestions"></datalist>
            <button class="quiet-button" type="submit">Go</button>
          </form>
          <label class="year-control">
            <span>Year</span>
            <select id="year-select" aria-label="Season year"></select>
          </label>
        </div>
        <nav class="tab-bar" role="tablist" aria-label="match13 views">
          <button id="stats-tab" class="tab-button active" type="button" role="tab" aria-selected="true" aria-controls="stats-panel">Team stats</button>
          <button id="matches-tab" class="tab-button" type="button" role="tab" aria-selected="false" aria-controls="matches-panel">Matches</button>
        </nav>

        <section id="stats-panel" role="tabpanel" aria-labelledby="stats-tab">
          <p id="stats-status" class="status" role="status"></p>
          <div id="stats-content"></div>
        </section>

        <section id="matches-panel" role="tabpanel" aria-labelledby="matches-tab" hidden>
          <div class="toolbar sticky-toolbar match-toolbar">
            <label class="event-select-control">
              <span>Event</span>
              <select id="event-select" aria-label="Select event">
                <option value="">Choose an event</option>
              </select>
            </label>
            <form id="event-key-form" class="event-key-form">
              <label class="sr-only" for="event-key-input">Enter event key</label>
              <input id="event-key-input" autocomplete="off" placeholder="or enter key">
              <button class="quiet-button" type="submit">Load</button>
            </form>
          </div>
          <p id="matches-status" class="status" role="status"></p>
          <div id="matches-content"></div>
        </section>
      </section>
    </main>
    <script type="module" src="popup.js"></script>
  </body>
</html>
